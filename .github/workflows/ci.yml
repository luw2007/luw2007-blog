name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build.py
      - run: test -f output/index.html
      - run: npx --yes html-validate output/index.html
      - run: test -z "$(grep -RIl '<script[^>]*src=\"http://' output --include='*.html' || true)"
